server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://rs-auth
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=2
        - id: dispatcher-service
          uri: lb://rs-dispatcher
          predicates:
            - Path=/api/dispatcher/**
          filters:
            - StripPrefix=2
        - id: dispatcher-v2-service
          uri: lb://rs-dispatcher-v2
          predicates:
            - Path=/rs-dispatcher-v2/**
          filters:
            - StripPrefix=2
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # JWKS URL used by Spring Security. Override with JWK_SET_URI env var in k8s or CI/CD.
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
