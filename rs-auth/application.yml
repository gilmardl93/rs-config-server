server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: true

jwt:
  secret: ${JWT_SECRET:mySecretKey}
  expiration: 3600000
