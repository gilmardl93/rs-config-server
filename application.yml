# Configuración compartida para todos los servicios

eureka:
  client:
    service-url:
      # Use environment override when running in-cluster; default to localhost for local development
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  level:
    root: INFO

# JWT shared secret (use env var in production)
jwt:
  secret: mySecretKey
